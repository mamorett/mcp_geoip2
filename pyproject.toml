[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoip2-mcp-server"
version = "1.2.0"
description = "MCP server for IP geolocation and ASN lookup using MaxMind GeoIP2 databases"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mcp>=1.0.0",
    "geoip2>=4.7.0",
    "fastmcp",
    "pydantic>=2.0.0",
    "prometheus-client>=0.19.0",
]

[project.scripts]
mcp_geoip2 = "geoip2_mcp_server.server:main"
geoip2-mcp-server = "geoip2_mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
